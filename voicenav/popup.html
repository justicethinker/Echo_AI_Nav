<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceNav</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      min-height: 380px;
      background: #08080f;
      color: #e2e8f0;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #0d0d1a 0%, #0a1a10 100%);
      border-bottom: 1px solid rgba(99,255,199,0.1);
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0f2a1a, #1a0f2e);
      border: 1.5px solid rgba(99,255,199,0.4);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon svg { color: #63ffc7; width: 16px; height: 16px; }

    .logo-text {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: #e2e8f0;
      letter-spacing: -0.02em;
    }

    .logo-text span { color: #63ffc7; }

    .settings-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s;
      display: flex;
    }
    .settings-btn:hover { color: rgba(255,255,255,0.7); }

    /* Mic area */
    .mic-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 20px 20px;
      gap: 14px;
    }

    .mic-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0f0f1a, #0a1a10);
      border: 2px solid rgba(99,255,199,0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }

    .mic-btn:hover {
      border-color: rgba(99,255,199,0.6);
      box-shadow: 0 6px 28px rgba(0,0,0,0.5), 0 0 20px rgba(99,255,199,0.15);
      transform: scale(1.04);
    }

    .mic-btn.listening {
      border-color: #63ffc7;
      animation: pulse 1.5s ease-in-out infinite;
      background: linear-gradient(135deg, #0a1628, #0d2618);
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 0 rgba(99,255,199,0.4); }
      50% { box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 14px rgba(99,255,199,0); }
    }

    .mic-btn svg { color: #63ffc7; width: 28px; height: 28px; }

    .mic-status {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      text-align: center;
    }

    .mic-status.active { color: #63ffc7; }

    /* Mode selector */
    .section {
      padding: 0 16px 16px;
    }

    .section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .mode-btn {
      padding: 10px 10px;
      border-radius: 10px;
      border: 1.5px solid rgba(255,255,255,0.07);
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.5);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mode-btn:hover {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.8);
    }

    .mode-btn.active {
      border-color: rgba(99,255,199,0.4);
      background: rgba(99,255,199,0.06);
      color: #e2e8f0;
    }

    .mode-btn .mode-icon { font-size: 15px; margin-bottom: 2px; }
    .mode-btn .mode-name { font-weight: 600; font-size: 12px; }
    .mode-btn .mode-desc { font-size: 10px; color: rgba(255,255,255,0.3); line-height: 1.3; }
    .mode-btn.active .mode-desc { color: rgba(99,255,199,0.5); }

    /* Footer */
    .footer {
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .api-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: rgba(255,255,255,0.3);
    }

    .api-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fbbf24;
    }

    .api-dot.connected { background: #63ffc7; }

    .open-options {
      font-size: 11px;
      color: rgba(99,255,199,0.5);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
      transition: color 0.15s;
    }
    .open-options:hover { color: #63ffc7; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <div class="logo-text">Voice<span>Nav</span></div>
    </div>
    <button class="settings-btn" id="open-settings" title="Settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="mic-section">
    <button class="mic-btn" id="mic-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>
    <div class="mic-status" id="mic-status">Click to speak a navigation command</div>
  </div>

  <div class="section">
    <div class="section-label">Activation Mode</div>
    <div class="mode-grid">
      <button class="mode-btn" data-mode="popup">
        <div class="mode-icon">🖱️</div>
        <div class="mode-name">Click Icon</div>
        <div class="mode-desc">Click the FAB on any page</div>
      </button>
      <button class="mode-btn" data-mode="hotkey">
        <div class="mode-icon">⌨️</div>
        <div class="mode-name">Hotkey</div>
        <div class="mode-desc">Press a key to activate</div>
      </button>
      <button class="mode-btn" data-mode="wakeword">
        <div class="mode-icon">💬</div>
        <div class="mode-name">Wake Word</div>
        <div class="mode-desc">"Hey Nav" to activate</div>
      </button>
      <button class="mode-btn" data-mode="always">
        <div class="mode-icon">🔴</div>
        <div class="mode-name">Always On</div>
        <div class="mode-desc">Continuous listening</div>
      </button>
    </div>
  </div>

  <div class="footer">
    <div class="api-status">
      <div class="api-dot" id="api-dot"></div>
      <span id="api-label">No API key</span>
    </div>
    <button class="open-options" id="open-options">Configure →</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
